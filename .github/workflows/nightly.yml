# ═══════════════════════════════════════════════════════════════
# 每日跨机体检 · 薄 caller（实现在组织级模板仓 _law-guard.yml）
#
# 为什么还需要这条：git hooks 只守「提交那一刻」，
# 线上的手工改动 / 同步漏 / 软链被删 没人守。
# 每天 02:17 CST 跑一次，留证到 artifact。
# ═══════════════════════════════════════════════════════════════
name: 巡检 · 每日跨机一致性

on:
  schedule:
    - cron: '17 18 * * *'      # 02:17 CST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    uses: xiaozhangyu-ai/.github/.github/workflows/_law-guard.yml@main
    with:
      runs_on: '["self-hosted","Linux","X64","octo-139"]'
      check_replicas: true
      check_sdk: true
      fail_fast: true

  services:
    name: 服务健康（yangyu 双机）
    runs-on: ['self-hosted', 'Linux', 'X64', 'octo-139']
    steps:
      - name: 139 本机 /health
        run: |
          set -uo pipefail
          B=$(curl -sS --max-time 3 http://127.0.0.1:8080/health 2>/dev/null || true)
          C=$(printf '%s' "$B" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).code??"NO_CODE"))}catch(e){process.stdout.write("PARSE_FAIL")}})')
          [ "$C" = "0" ] || { echo "::error::139 yangyu /health 异常 code=$C"; exit 1; }
          echo "✅ 139 yangyu 健康"
  watchdog:
    name: 看门狗 · 卡死/离线检测
    needs: [guard]
    if: always()
    runs-on: ubuntu-latest          # 刻意用 GitHub 托管：本机 runner 卡死时它仍能跑
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: 检测排队/运行超时的任务
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.OCTO_ALERT_WEBHOOK }}
        run: |
          set -uo pipefail
          STALE_MIN=0
          NOW=$(date -u +%s)
          # 自检：读不到「本次运行」的信息说明 API/凭据异常 —— 硬失败，绝不静默放行
          SELF_TS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.created_at' 2>/dev/null || true)
          if [ -z "$SELF_TS" ]; then
            echo "::error::看门狗自检失败：读不到本次 run 的 created_at（API 或凭据异常）"
            exit 1
          fi
          echo "自检通过：本次 run 创建于 $SELF_TS"
          BAD=""
          SCANNED=0
          for st in queued in_progress; do
            IDS=$(gh api "repos/${{ github.repository }}/actions/runs?status=${st}&per_page=50" --jq '[.workflow_runs[].run_id]|join(" ")' 2>/dev/null || true)
            for r in $IDS; do
              TS=$(gh api "repos/${{ github.repository }}/actions/runs/${r}" --jq '.created_at' 2>/dev/null || true)
              if [ -z "$TS" ]; then
                echo "::error::读不到 run ${r} 的 created_at —— 检测不可信，硬失败"
                exit 1
              fi
              SCANNED=$((SCANNED + 1))
              AGE=$(( (NOW - $(date -u -d "$TS" +%s)) / 60 ))
              if [ "$AGE" -ge "$STALE_MIN" ]; then
                BAD="${BAD}${st}#${r} 已 ${AGE} 分钟; "
              fi
            done
          done
          echo "已扫描 ${SCANNED} 个 queued/in_progress 任务（阈值 ${STALE_MIN} 分钟）"
          if [ "$SCANNED" -eq 0 ]; then
            echo "::warning::无 queued/in_progress 任务（若 runner 全掉线，排队任务会在下一轮被检出）"
          fi
          if [ -n "$BAD" ]; then
            echo "::error::发现卡死任务: ${BAD}"
            if [ -n "$WEBHOOK" ]; then
              curl -sS --max-time 10 -X POST "$WEBHOOK" -H 'Content-Type: application/json' \
                -d "{\"text\":\"[CI STUCK] ${{ github.repository }}: ${BAD}\"}" || true
            fi
            exit 1
          fi
          echo "✅ 无卡死任务"
